# Tier declarations for this repository, read by the tier lens (/analysis/tiers).
#
# A declared tier overrides the tier derived from imports, annotations, recorded routes,
# file kinds, and path tokens, and is reported as `declared` evidence. Globs are POSIX and
# `**` matches any depth. The first matching entry wins, so put specific globs first.
tiers:
  - tier: frontend
    globs:
      - "ui/**"
  - tier: api
    globs:
      - "src/api/**"
      - "src/server.ts"
      - "src/server-restart.ts"
      - "src/index.ts"
      # Entry surfaces: the CLI, the MCP server, and the terminal's WebSocket endpoint.
      - "src/cli.ts"
      - "src/cli/**"
      - "src/mcp/**"
      - "src/terminal/ws.ts"
  # The narrator's pure prompt builders and the dependency-risk analysis are domain logic;
  # only the provider client, its settings and keys, and the OSV and deps.dev clients talk to
  # an outside system. Specific files come first because the first matching entry wins.
  - tier: domain
    globs:
      - "src/narrator/tour.ts"
      - "src/narrator/coverage-plan.ts"
      - "src/narrator/coverage-weekly.ts"
      - "src/risk/report.ts"
      - "src/risk/inventory.ts"
  - tier: integration
    globs:
      - "src/integrations/**"
      - "src/narrator/**"
      - "src/risk/**"
      # The terminal hosts external agent processes over a PTY.
      - "src/terminal/**"
  - tier: data
    globs:
      - "src/cache/**"
      - "src/state/**"
      - "src/repository.ts"
  # Platform plumbing every tier may use: configuration, spawning a process, and the scan
  # ceiling's path boundary. Infra sits beside the tier stack, so reading it is never wrong-way.
  - tier: infra
    globs:
      - "src/config.ts"
      - "src/process.ts"
      - "src/boundary/repository-root.ts"
  - tier: build
    globs:
      - "scripts/**"
      - "bin/**"
  - tier: domain
    globs:
      - "src/analysis/**"
      - "src/boundary/**"
      - "src/resolve/**"
      - "src/scan/**"
      - "src/view/**"
      - "src/workspace/**"
      - "src/check/**"
      - "src/export/**"
      - "src/report/**"
      - "src/status.ts"
      - "src/types.ts"
      - "src/types/**"

# Declared architecture, read by the tier lens (Phase 35 Y7) and `strabo check`.
#
# `allow: import` states an intended path: the tier edge it covers is drawn as allowed rather
# than wrong-way. The server's routes read the stores and caches and call the narrator and
# risk integrations directly, without a domain service in between; that is the design, so
# those skip-layer edges are declared. Upward edges stay flagged whatever the rules say.
rules:
  - id: api-reads-stores
    from: "src/api/**"
    to: "src/state/**"
    allow: import
  - id: api-reads-caches
    from: "src/api/**"
    to: "src/cache/**"
    allow: import
  - id: api-calls-narrator
    from: "src/api/**"
    to: "src/narrator/**"
    allow: import
  - id: api-calls-risk
    from: "src/api/**"
    to: "src/risk/**"
    allow: import
  # Domain code reads the graph and workspace caches and the repository store it owns. Data and
  # integration are both adapters under domain here; the rank puts integration between them, so
  # without this rule every domain read of a store would read as skipping a tier.
  - id: domain-reads-data
    from: "src/analysis/**"
    to: "src/cache/**"
    allow: import
