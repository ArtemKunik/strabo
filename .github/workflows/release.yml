name: Release

# Publishes strabo-map to npm when a version tag is pushed (`git tag v0.1.0 && git push --tags`).
# Uses npm trusted publishing (OIDC): link a Trusted Publisher for strabo-map on npmjs.com
# (Settings -> Trusted Publisher -> GitHub Actions: ArtemKunik/strabo, workflow release.yml).
# No NPM_TOKEN secret is needed; the short-lived OIDC token also satisfies the package's 2FA
# requirement, so no one-time password is prompted.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          # No registry-url: it writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
          # into .npmrc, and with no NODE_AUTH_TOKEN (an OIDC flow) the empty token makes
          # npm skip the trusted-publishing exchange and fail the PUT.
          package-manager-cache: false
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Package check
        run: npm run test:pack
      - name: Publish
        run: npm publish --provenance --access public
