<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strabo — repository map</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230c1016'/%3E%3Cpath%20d='M16%205%2027%2016%2016%2027%205%2016Z'%20fill='none'%20stroke='%234c9aff'%20stroke-width='2.5'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='3'%20fill='%234c9aff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="tb-group tb-brand-group">
        <h1 class="brand"><span class="brand-mark" aria-hidden="true">◈</span> Strabo</h1>
      </div>
      <div class="tb-group tb-repo-group" role="group" aria-label="Repository">
        <label class="control">
          <span class="control-label">Repository</span>
          <select id="repository"></select>
        </label>
        <button id="browse" type="button" title="Browse filesystem for a repository">
          Choose folder…
        </button>
        <button id="forget" type="button" disabled title="Forget this repository">Forget</button>
      </div>
      <div class="tb-group tb-view-group" role="group" aria-label="View">
        <label class="control">
          <span class="control-label">Detail</span>
          <select id="detail">
            <option value="block" selected>Directories</option>
            <option value="file">Files</option>
            <option value="system">System</option>
          </select>
        </label>
        <label class="control">
          <span class="control-label">Tier</span>
          <select id="tier">
            <option value="off" selected>Off</option>
            <option value="all">All tiers</option>
            <option value="frontend">Frontend</option>
            <option value="api">API surface</option>
            <option value="domain">Domain/service</option>
            <option value="data">Data</option>
            <option value="integration">Integration</option>
            <option value="infra">Infra/config</option>
            <option value="build">Build/tooling</option>
            <option value="tests">Tests</option>
            <option value="unclassified">Unclassified</option>
          </select>
        </label>
        <label class="control control-search">
          <span class="search-wrap">
            <input
              id="filter"
              type="search"
              placeholder="Filter paths…  (⌘K)"
              aria-label="Filter paths"
              autocomplete="off"
            />
            <button id="filter-clear" type="button" class="search-clear" aria-label="Clear filter" hidden>
              ×
            </button>
          </span>
          <span id="filter-count" class="filter-count" aria-live="polite" hidden></span>
        </label>
      </div>
      <div class="tb-group tb-review-group" role="group" aria-label="Review">
        <label class="control">
          <span class="control-label">Review</span>
          <select id="overlay">
            <option value="none" selected>None</option>
            <option value="impact">Change impact</option>
            <option value="cycles">Cycles</option>
            <option value="test-reach">Test reach</option>
            <option value="module-depth">Module depth</option>
            <option value="ownership">Ownership</option>
            <option value="smells">Smells</option>
            <option value="architecture">Architecture health</option>
            <option value="hotspots">Function hotspots</option>
          </select>
        </label>
        <button id="refresh" type="button" title="Rescan repository (bypass cache)">Refresh</button>
      </div>
      <nav id="breadcrumb" class="breadcrumb tb-group" aria-label="Directory drill-down"></nav>
      <span class="tb-spacer"></span>
      <button
        id="settings-toggle"
        type="button"
        class="quiet-button"
        aria-expanded="false"
        aria-controls="settings-panel"
        title="Strabo settings"
      >
        Settings
      </button>
      <button
        id="diagnostics-toggle"
        type="button"
        class="quiet-button"
        aria-expanded="false"
        aria-controls="diagnostics"
      >
        Diagnostics <span id="diagnostics-badge" class="diag-badge" hidden></span>
      </button>
      <span id="status" class="status" role="status"></span>
    </header>

    <main class="workspace">
      <div class="graph-wrap">
        <div id="graph" class="graph" aria-label="Dependency map"></div>
        <div id="graph-empty" class="graph-empty" hidden>
          <p class="graph-empty-title">No nodes match</p>
          <p class="graph-empty-sub">Try a shorter path fragment, or clear the filter.</p>
          <button id="graph-empty-clear" type="button">Clear filter</button>
        </div>
        <div id="graph-loading" class="graph-loading" hidden>
          <span class="spinner" aria-hidden="true"></span><span>Scanning repository…</span>
        </div>
        <div id="system-note" class="system-note" hidden></div>
        <div id="graph-hint" class="graph-hint" hidden>
          <p class="graph-hint-title">Reading the map</p>
          <p class="graph-hint-body">
            Click a node for its passport. Double-click a directory to drill in.
            Press <kbd>?</kbd> for shortcuts.
          </p>
        </div>
        <div class="graph-toolbar" role="toolbar" aria-label="Graph actions">
          <button id="tb-focus" type="button" class="tb-icon" title="Center selection (F)" aria-label="Center selection">
            <span aria-hidden="true">◎</span>
          </button>
          <button id="tb-impact" type="button" class="tb-icon" title="Show change impact (I)" aria-label="Show change impact">
            <span aria-hidden="true">⚡</span>
          </button>
          <button
            id="tb-outside"
            type="button"
            class="tb-icon"
            hidden
            aria-pressed="false"
            title="Show the selected file’s links to other units (O)"
            aria-label="Show outside links"
          >
            <span aria-hidden="true">⇱</span>
          </button>
          <button id="tb-path" type="button" class="tb-icon" title="Trace a path between two nodes (P)" aria-label="Trace a path">
            <span aria-hidden="true">⇢</span>
          </button>
          <button id="tb-boundaries" type="button" class="tb-icon" title="Toggle directories / files (B)" aria-label="Toggle boundaries">
            <span aria-hidden="true">▦</span>
          </button>
          <button id="tb-clear" type="button" class="tb-icon" title="Clear selection (Esc)" aria-label="Clear selection">
            <span aria-hidden="true">✕</span>
          </button>
          <span class="tb-divider" aria-hidden="true"></span>
          <span
            id="group-count"
            class="group-count"
            hidden
            aria-live="polite"
          ></span>
          <button
            id="tb-delegate-group"
            type="button"
            hidden
            title="Delegate the selected files to an agent (G)"
          >
            Delegate…
          </button>
          <span id="hover" class="graph-hover" role="status"></span>
          <div class="tb-overflow-wrap">
            <button
              id="tb-overflow"
              type="button"
              class="tb-icon"
              title="More actions"
              aria-label="More actions"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <span aria-hidden="true">⋯</span>
            </button>
            <div id="tb-overflow-menu" class="tb-menu" role="menu" hidden>
              <button id="tb-timeline" type="button" role="menuitem" title="Show recorded changes (T)">
                Timeline <kbd>T</kbd>
              </button>
              <button id="tb-review" type="button" role="menuitem" title="Review working tree changes (R)">
                Review changes <kbd>R</kbd>
              </button>
              <button id="tb-risk" type="button" role="menuitem" title="Dependency risk: advisories and licenses (V)">
                Dependency risk <kbd>V</kbd>
              </button>
            </div>
          </div>
        </div>
        <div id="tooltip" class="node-tooltip" hidden></div>
        <div class="zoom-controls" role="group" aria-label="Zoom">
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <button id="zoom-fit" type="button" aria-label="Fit to view">⤢</button>
        </div>
      </div>
      <div id="float-layer" class="float-layer">
        <div id="overlay-panel" class="overlay-panel" hidden></div>
        <div id="edge-panel" class="overlay-panel edge-panel" hidden></div>
        <div id="review-panel" class="overlay-panel review-panel" hidden></div>
        <div id="risk-panel" class="overlay-panel risk-panel" hidden></div>
        <div id="timeline-panel" class="timeline-panel" hidden></div>
        <div id="legend" class="legend" aria-label="Legend"></div>
        <aside id="inspector" class="inspector" hidden></aside>
        <section id="member-view" class="member-view" aria-label="Member map" hidden></section>
        <section id="workspace-panel" class="workspace-panel" aria-label="Workspace" hidden></section>
        <section id="passport-panel" class="passport-panel" aria-label="Repository passport" hidden></section>
        <aside id="diagnostics" class="diagnostics" aria-label="Scan diagnostics" hidden></aside>
        <section id="settings-panel" class="settings-panel" aria-label="Settings" hidden></section>
        <section id="shortcuts" class="shortcuts" aria-label="Keyboard shortcuts" hidden></section>
      </div>
    </main>

    <footer id="bottom-bar" class="bottom-bar">
      <div id="strip" class="strip" aria-label="Tests and components"></div>
      <div id="float-dock" class="float-dock" role="toolbar" aria-label="Panels"></div>
      <div class="bottom-meta">
        <span id="statusbar-legend" class="bottom-meta-item"></span>
      </div>
    </footer>

    <dialog id="folder-dialog" class="dialog" aria-label="Select a repository folder">
      <header class="dialog-header">
        <strong>Select a repository folder</strong>
        <button id="folder-cancel" type="button" class="dialog-close" aria-label="Close">×</button>
      </header>
      <p id="folder-path" class="dialog-path"></p>
      <p id="folder-note" class="dialog-note"></p>
      <ul id="folder-list" class="folder-list"></ul>
      <footer class="dialog-footer">
        <button id="folder-up" type="button">Up</button>
        <button id="folder-use" type="button">Use this folder</button>
      </footer>
    </dialog>

    <script src="/vendor/cytoscape/cytoscape.min.js"></script>
    <script type="module" src="/strabo.bundle.js"></script>
  </body>
</html>
